name: Build YAWMY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android module
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/yawmiyati/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/assets

          cp MainActivity.java app/src/main/java/com/yawmiyati/app/
          cp BootReceiver.java app/src/main/java/com/yawmiyati/app/
          cp PrayerAlarmReceiver.java app/src/main/java/com/yawmiyati/app/

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          cp colors.xml app/src/main/res/values/
          cp strings.xml app/src/main/res/values/
          cp styles.xml app/src/main/res/values/

          cp notification.wav app/src/main/res/raw/notification.wav

          cp ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher_round.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          for f in index.html sw.js manifest.webmanifest icon-192.png icon-512.png yawmiyati_logo.png yawmiyati_splash_icon.png ATTRIBUTIONS.txt README.txt; do
            if [ -f "$f" ]; then
              cp "$f" app/src/main/assets/
            fi
          done

      - name: Write Gradle files
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "YawmiyatiAndroid"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.yawmiyati.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.yawmiyati.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "1.0.1"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation "androidx.core:core:1.13.1"
          }
          EOF

          printf '# YAWMY build\n' > app/proguard-rules.pro

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAWMY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
